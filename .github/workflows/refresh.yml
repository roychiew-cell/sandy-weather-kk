name: Refresh weather data

on:
  schedule:
    # 23:00 and 11:00 UTC = 07:00 and 19:00 Malaysia time (MYT, UTC+8)
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all sources
        run: python3 -I scripts/fetch.py
      - name: Commit updated data
        run: |
          git config user.name "sandy-refresh"
          git config user.email "sandy-refresh@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
