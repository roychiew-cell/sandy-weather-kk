name: Refresh weather data and deploy

on:
  schedule:
    # 23:00 and 11:00 UTC = 07:00 and 19:00 Malaysia time (MYT, UTC+8). GitHub may delay or skip a run at busy times.
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  push:
    branches: [main]
    paths: ["index.html", "call.json", "README.md"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all sources (skipped on a plain page push)
        if: github.event_name != 'push'
        run: python3 -I scripts/fetch.py
      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "sandy-refresh"
          git config user.email "sandy-refresh@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
