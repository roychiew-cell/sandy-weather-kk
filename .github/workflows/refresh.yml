name: Refresh weather data and deploy

on:
  schedule:
    # every hour at :07 (off the top of the hour, when GitHub's queue is busiest). GitHub may still delay or skip a run.
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths: ["index.html", "call.json", "README.md", "data/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always build from the current head of main, not the historical triggering commit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all sources (skipped on a plain page push)
        if: github.event_name != 'push'
        run: python3 -I scripts/fetch.py
      - name: Commit updated data (rebase and retry if the branch moved)
        if: github.event_name != 'push'
        run: |
          set -e
          git config user.name "sandy-refresh"
          git config user.email "sandy-refresh@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $i)"; git pull --rebase
          done
          echo "could not push the data commit after 3 attempts"; exit 1
      - name: Make sure the tree to deploy is the current head of main
        run: git fetch origin main && git reset --hard origin/main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
